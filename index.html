<!doctype html>
<html lang="en" data-acadia-theme="system" data-acadia-theme-storage-key="mercury-theme">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#eef1f5" data-acadia-theme-color>
    <meta
      name="description"
      content="Mercury shows a focused live view of global and domestic market movement."
    >
    <title>Mercury | Home</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <link rel="manifest" href="site.webmanifest">
    <script src="theme.js?v=20260720-material-theme"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
      referrerpolicy="no-referrer"
    >
    <link rel="stylesheet" href="styles.css?v=20260811-figma-home">
  </head>
  <body class="mercury-app mercury-page-dashboard mercury-page-home" data-mercury-page="dashboard">
    <a class="skip-link" href="#main-content">Skip to market overview</a>

    <main id="main-content" class="home-shell" aria-busy="true">
      <header class="home-navbar" aria-label="Mercury navigation">
        <a class="home-brand-mark" href="index.html" aria-label="Mercury home">
          <i class="fa-solid fa-globe" aria-hidden="true"></i>
        </a>
        <nav class="home-nav-links" aria-label="Mercury pages">
          <a class="home-nav-link is-active" href="index.html" aria-current="page">Home</a>
          <a class="home-nav-link" href="markets.html">Markets</a>
          <a class="home-nav-link" href="indicators.html">Economy</a>
          <button class="home-nav-link" type="button" disabled aria-disabled="true" title="Watchlist is coming soon">Watchlist</button>
          <button class="home-nav-link" type="button" disabled aria-disabled="true" title="Profile is coming soon">Profile</button>
        </nav>
        <div class="home-profile-wrap">
          <button
            id="home-profile-trigger"
            class="home-profile-trigger"
            type="button"
            aria-expanded="false"
            aria-controls="home-profile-menu"
            aria-label="Open account menu"
          >
            <i class="fa-solid fa-circle-user" aria-hidden="true"></i>
          </button>
          <div id="home-profile-menu" class="home-profile-menu acadia-account-menu-panel" role="menu" hidden>
            <button class="home-theme-toggle acadia-account-menu-item" type="button" role="menuitem" data-acadia-theme-toggle>
              <i class="fa-solid fa-toggle-off" data-acadia-theme-toggle-icon aria-hidden="true"></i>
              <span>Theme</span>
            </button>
            <button class="home-menu-disabled acadia-account-menu-item" type="button" role="menuitem" disabled aria-disabled="true">Profile coming soon</button>
          </div>
        </div>
      </header>

      <section class="home-market-overview" aria-labelledby="home-market-title">
        <h1 id="home-market-title" class="visually-hidden">Mercury market overview</h1>
        <div class="home-control-row">
          <div class="home-segmented-control" role="group" aria-label="Market period">
            <button type="button" class="home-period-control" data-home-period="today" aria-pressed="false">Day</button>
            <button type="button" class="home-period-control" data-home-period="week" aria-pressed="true">Week</button>
            <button type="button" class="home-period-control" data-home-period="month" aria-pressed="false">Month</button>
            <button type="button" class="home-period-control" data-home-period="year" aria-pressed="false">Year</button>
          </div>
          <div class="home-segmented-control home-scope-control" role="group" aria-label="Market scope">
            <button type="button" class="home-scope-control" data-home-scope="Global" aria-pressed="true">Global</button>
            <button type="button" class="home-scope-control" data-home-scope="United States" aria-pressed="false">Domestic</button>
            <button type="button" class="home-scope-control" data-home-scope="International" aria-pressed="false">International</button>
          </div>
        </div>

        <div
          id="home-graph-stage"
          class="home-graph-stage"
          data-period="week"
          data-scope="Global"
          aria-label="Market graph placeholder for the selected period and scope"
        ></div>

        <div id="home-market-cards" class="home-market-cards" aria-live="polite" aria-busy="true"></div>
        <div id="home-indicator-cards" class="home-indicator-cards" aria-label="Economic signals" aria-live="polite" aria-busy="true"></div>
        <section id="home-market-outage-recovery" class="home-market-outage-recovery" aria-label="Market data recovery" hidden>
          <div id="home-market-outage-card"></div>
        </section>
      </section>
      <p id="dashboard-status" class="visually-hidden" role="status" aria-live="polite" aria-atomic="true">
        Checking latest market data.
      </p>
    </main>

    <script src="app.js?v=20260811-figma-home"></script>
  </body>
</html>
